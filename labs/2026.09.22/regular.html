<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Уязвимости регулярных выражений</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="regular.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/public/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/public/favicon-16x16.png">
</head>

<body>
  <h1>ReDoS demo</h1>
  <p>
    Уязвимое выражение:
    <code id="vulnerable-regex"></code>
  </p>
  <p>
    Безопасное выражение:
    <code id="safe-regex"></code>
  </p>
  <label for="input">Строка для проверки:</label>
  <input id="input" value="aaaaaaaaaaaaaaaaaaaaX" />
  <button id="vulnerable">
    Уязвимый Regex
  </button>
  <button id="safe">
    Безопасный Regex
  </button>
  <button id="block-main-thread" class="danger">
    Уязвимый Regex в Главном потоке
  </button>
  <div class="result">
    <div id="status">Результат появится здесь</div>
  </div>
  <script type="module" src="./regular.js"></script>
</body>

</html>
